<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dates in Month</title>

    <script>
        // kiểm tra năm nhuận
        function isLeapYear(n) {
            return (n % 4 == 0 && n % 100 != 0) || (n % 400 == 0);
        }

        function update() {
            let year = document.f.year;
            let month = document.f.month;
            let date = document.f.date;

            // kiểm tra year có phải số không
            if (year.value == "" || isNaN(year.value)) {
                date.value = "Year must be a number";
                year.focus();
                return;
            }

            // dùng switch để xác định số ngày
            switch (month.value) {
                case "1":
                case "3":
                case "5":
                case "7":
                case "8":
                case "10":
                case "12":
                    date.value = 31;
                    break;

                case "4":
                case "6":
                case "9":
                case "11":
                    date.value = 30;
                    break;

                case "2":
                    date.value = isLeapYear(year.value) ? 29 : 28;
                    break;
            }
        }
    </script>
</head>

<body onload="update()">
    <form name="f">
        <table border="1" align="center" cellpadding="10">
            <tr>
                <td colspan="2" align="center">
                    <h2>DATES IN MONTH</h2>
                </td>
            </tr>

            <tr>
                <td align="right">Year:</td>
                <td>
                    <input name="year" value="2024" onblur="update()">
                </td>
            </tr>

            <tr>
                <td align="right">Month:</td>
                <td>
                    <select name="month" onchange="update()">
                        <option value="1">01</option>
                        <option value="2">02</option>
                        <option value="3">03</option>
                        <option value="4">04</option>
                        <option value="5">05</option>
                        <option value="6">06</option>
                        <option value="7">07</option>
                        <option value="8">08</option>
                        <option value="9">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td align="right">Date:</td>
                <td>
                    <input name="date" readonly>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
