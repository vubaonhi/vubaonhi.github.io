<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To Do List</title>

<style>

body{
    background:#eee;
    font-family:Georgia, serif;
}

/* khung chính */
.container{
    width:300px;
    background:#f7f381;
    margin:50px auto;
    padding:20px;
    border:1px solid #ccc;
    box-shadow: 3px 3px 5px gray;
}

/* tiêu đề */
h1{
    text-align:center;
}

/* ngày */
.date{
    text-align:center;
    font-style:italic;
}

/* danh sách */
ol{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

    <h1>Today's to do list</h1>

    <p class="date">Monday, September 19th</p>

    <ol>
        <li>Write a blog post</li>
        <li>Go to the bank</li>
        <li>Study for exams</li>
        <li>Renew web hosting account and domain name</li>
        <li>Learn something new</li>
        <li>Update project log</li>
    </ol>

</div>

</body>
</html>
