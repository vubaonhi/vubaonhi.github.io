<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini calculator</title>

<style>
    body {
        font-family: "Times New Roman", serif;
        text-align: center;
    }

    table {
        margin: auto;
    }

    input, select {
        width: 120px;
    }

    h2 {
        margin-bottom: 10px;
    }
</style>

<script>
function calculate() {
    var a = document.frmCal.txta;
    var b = document.frmCal.txtb;
    var o = document.frmCal.slto;
    var r = document.frmCal.txtr;

    var numberFormat = /^[+-]?\d+(\.\d+)?$/;

    if (!numberFormat.test(a.value)) {
        alert("a must be a number!");
        a.focus();
        return;
    }


    if (!numberFormat.test(b.value)) {
        alert("b must be a number!");
        b.focus();
        return;
    }

    if ((o.value == "/" || o.value == "%") && parseFloat(b.value) == 0) {
        alert("b can't be 0!");
        b.focus();
        return;
    }
    var result = eval(a.value + o.value + b.value);
    r.value = result;
}
</script>

</head>

<body>

<form name="frmCal">

<h2>MINI CALCULATOR</h2>

<table border="0">
<tr>
    <td align="right">a = </td>
    <td><input name="txta" value="5"></td>
</tr>

<tr>
    <td align="right">b = </td>
    <td><input name="txtb" value="2"></td>
</tr>

<tr>
    <td align="right">Operator:</td>
    <td>
        <select name="slto">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
    </td>
</tr>

<tr>
    <td align="right">Result:</td>
    <td><input name="txtr" readonly></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="button" value="Calculate" onclick="calculate()">
    </td>
</tr>
</table>

</form>

</body>
</html>
